# CI/CD pipeline for hello-elixir
#
#   lint   mix format --check-formatted, mix compile, mix credo, mix docs (MIX_ENV=dev)
#   test   mix test (MIX_ENV=test: mox + a local plug_cowboy server)
#   build  mix compile (MIX_ENV=prod) on every push/MR
#   sbom   mix sbom.cyclonedx -> normalized, scope-aware CycloneDX SBOM enriched
#          with the registry's own advisory findings; then sbom-reach turns it
#          into SARIF (reachability is `unknown` for every finding: sbom-reach
#          has no Hex analyzer, so this stage only carries advisory + scope)
#   publish PUT the SBOM, then the SARIF, to dependably's projects plane
#
# Dev-only deps (credo, ex_doc, ymlr) exist only under MIX_ENV=dev, and
# test-only deps (mox, plug_cowboy) only under MIX_ENV=test, so each stage
# sets the MIX_ENV it needs. `mix deps.get` fetches every scope regardless.
#
# Every Hex package is resolved from the private dependably registry. mix.exs
# names the repo on every dependency and dependably_public_key.pem pins the
# org's signing key; the token comes from the shared dependably CI/CD
# variables that every project in the group uses:
#   REGISTRY_URL   private registry base, e.g. https://dependably.northwardlabs.ca/
#   REGISTRY_KEY   read-only token for that registry (masked)
# The job HARD-FAILS when either is empty rather than silently falling back to
# hex.pm, and refuses to run when REGISTRY_URL names a different host than the
# one pinned below, so the key in the repo always matches the registry.

stages:
  - lint
  - test
  - build
  - sbom
  - publish

image: ${DEP_IMAGE_REGISTRY}/library/elixir:latest

variables:
  DEP_IMAGE_REGISTRY: "dependably.northwardlabs.ca"
  # The registry URL the pinned signing key belongs to. Compared against
  # REGISTRY_URL in registry_setup so the two cannot drift apart.
  DEPENDABLY_HEX_URL: "https://dependably.northwardlabs.ca/hex"
  MIX_ENV: "test"
  # Where the SBOM/SARIF land on dependably's projects plane. projectVersion is
  # the tag or the branch slug; only the default branch and tags become latest.
  SBOM_PROJECT_NAME: "hello-elixir"
  # sbom-reach is not published anywhere yet, so the sbom-reach job builds it
  # from this repo at this ref with the job token.
  SBOM_REACH_REPO_PATH: "moonlitlabs/sbom-reachability"
  SBOM_REACH_REF: "main"

cache:
  paths:
    - deps/
    - _build/

# Registers the dependably repo in Mix's per-user Hex config from REGISTRY_KEY.
# `mix hex.repo add` writes the URL, pinned public key, and token to
# ~/.hex/hex.config, which is how the token stays out of the repository.
# Mirrors the REGISTRY_URL/REGISTRY_KEY wiring in the other projects' pipelines.
#
# `mix local.hex` / `mix local.rebar` install the Hex client and rebar3 build
# tool themselves; they are not packages and do not go through the registry.
.registry_setup: &registry_setup |
  if [ -z "${REGISTRY_URL:-}" ] || [ -z "${REGISTRY_KEY:-}" ]; then
    echo "ERROR: REGISTRY_URL/REGISTRY_KEY are empty - refusing to resolve Hex packages without the private registry." >&2
    exit 1
  fi
  expected="${REGISTRY_URL%/}/hex"
  if [ "$DEPENDABLY_HEX_URL" != "$expected" ]; then
    echo "ERROR: .gitlab-ci.yml pins $DEPENDABLY_HEX_URL but REGISTRY_URL resolves to $expected." >&2
    exit 1
  fi
  mix local.hex --force
  mix local.rebar --force
  mix hex.repo add dependably "$DEPENDABLY_HEX_URL" \
    --public-key dependably_public_key.pem \
    --auth-key "$REGISTRY_KEY"
  mix deps.get

default:
  before_script:
    - *registry_setup

linting:
  stage: lint
  variables:
    MIX_ENV: "dev"
  script:
    - mix format --check-formatted
    - mix compile --warnings-as-errors
    - mix credo --strict
    - mix docs
    - mix hello.manifest
  artifacts:
    paths:
      - doc/
      - deps-manifest.yaml
    expire_in: 1 week

unit_tests:
  stage: test
  script:
    - mix test
  artifacts:
    when: always
    expire_in: 1 week

build_project:
  stage: build
  variables:
    MIX_ENV: "prod"
  script:
    - mix compile --warnings-as-errors

# --- sbom stage ---------------------------------------------------------------

# Generates the SBOM from the dev-only `sbom` package (so it sees every scope),
# then scripts/sbom_tool.py strips the private-registry namespace from the Hex
# purls and asks the registry's vulnerability report for each package. See the
# script's docstring for why both steps exist.
sbom:
  stage: sbom
  variables:
    MIX_ENV: "dev"
  script:
    - mix sbom.cyclonedx -o bom.raw.cdx.json -f
    - python3 scripts/sbom_tool.py mix-normalize bom.raw.cdx.json bom.cdx.json
    - python3 scripts/sbom_tool.py enrich bom.cdx.json bom.vulns.cdx.json
  artifacts:
    paths:
      - bom.cdx.json
      - bom.vulns.cdx.json
    reports:
      cyclonedx: bom.cdx.json
    expire_in: 30 days

# Runs sbom-reach (moonlitlabs/sbom-reachability) in analyze mode over the
# enriched SBOM. The tool has no Hex analyzer, so every result reports
# reachability `unknown` and a run-level warning says so; `--fail-on none`
# keeps the job informational. pnpm installs come from the private npm proxy,
# the same REGISTRY_URL/REGISTRY_KEY the Hex setup uses.
sbom-reach:
  stage: sbom
  image: ${DEP_IMAGE_REGISTRY}/library/node:22
  needs:
    - job: sbom
      artifacts: true
  variables:
    COREPACK_NPM_REGISTRY: "${REGISTRY_URL}/npm"
    COREPACK_NPM_TOKEN: "$REGISTRY_KEY"
  before_script:
    - |
      if [ -z "${REGISTRY_URL:-}" ] || [ -z "${REGISTRY_KEY:-}" ]; then
        echo "ERROR: REGISTRY_URL/REGISTRY_KEY are empty - refusing to install npm packages without the private registry." >&2
        exit 1
      fi
      HOST=$(printf '%s' "$REGISTRY_URL" | sed -E 's|^https?://||; s|/.*||')
      printf 'registry=%s/npm/\n//%s/npm/:_authToken=%s\nfund=false\n' \
        "$REGISTRY_URL" "$HOST" "$REGISTRY_KEY" > "$HOME/.npmrc"
  script:
    - git clone --depth 1 --branch "$SBOM_REACH_REF" "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${SBOM_REACH_REPO_PATH}.git" /tmp/sbom-reach
    - cd /tmp/sbom-reach && corepack enable && corepack prepare --activate && pnpm install --frozen-lockfile && pnpm -r build && cd "$CI_PROJECT_DIR"
    - node /tmp/sbom-reach/packages/cli/dist/cli.js analyze --sbom bom.vulns.cdx.json --src . --fail-on none --sarif-category sbom-reach -o results.sarif
  artifacts:
    when: always
    paths:
      - results.sarif
    expire_in: 30 days

# Uploads the SBOM and then the SARIF to dependably. Order matters: only the
# SBOM PUT can create the project version (autoCreate), and the SARIF PUT is
# a 404 against a version that does not exist yet. Needs DEPENDABLY_SBOM_TOKEN,
# a token carrying the `sbom:upload` capability alone (the token modal's `sbom`
# preset). That is NOT REGISTRY_KEY: the read-only registry token cannot
# upload, and sbom:upload is an admin capability that must stay out of the
# unprotected variable every MR pipeline can read.
sbom-publish:
  stage: publish
  interruptible: false
  resource_group: sbom-publish
  needs:
    - job: sbom
      artifacts: true
    - job: sbom-reach
      artifacts: true
  variables:
    GIT_STRATEGY: none
  before_script: []
  script:
    - |
      if [ -z "${REGISTRY_URL:-}" ]; then
        echo "ERROR: REGISTRY_URL is empty - nowhere to publish the SBOM." >&2
        exit 1
      fi
      if [ -z "${DEPENDABLY_SBOM_TOKEN:-}" ]; then
        echo "ERROR: DEPENDABLY_SBOM_TOKEN is not set. Create a dependably API token with the sbom:upload capability (the 'sbom' preset) and add it as a masked, protected CI/CD variable." >&2
        exit 1
      fi
      BASE="${REGISTRY_URL%/}"
      VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}"
      case "$VERSION" in
        ''|*[!A-Za-z0-9._-]*) echo "ERROR: version label '$VERSION' is outside [A-Za-z0-9._-]." >&2; exit 1 ;;
      esac
      if [ -n "${CI_COMMIT_TAG:-}" ] || [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then IS_LATEST=true; else IS_LATEST=false; fi
      put() {
        kind="$1"; file="$2"; extra="$3"
        [ -s "$file" ] || { echo "ERROR: $file is missing or empty." >&2; return 1; }
        echo "PUT /api/v1/$kind <- $file ($(wc -c < "$file") bytes) as $SBOM_PROJECT_NAME@$VERSION"
        resp=$(curl -sS -w '\n%{http_code}' -X PUT \
          "$BASE/api/v1/$kind?projectName=$SBOM_PROJECT_NAME&projectVersion=$VERSION$extra" \
          -H "Authorization: Bearer $DEPENDABLY_SBOM_TOKEN" \
          -H 'Content-Type: application/json' \
          --data-binary "@$file") || resp=""
        status=$(printf '%s' "$resp" | tail -n 1)
        body=$(printf '%s' "$resp" | sed '$d')
        if [ "$status" = "200" ]; then echo "  ok: $body"; return 0; fi
        echo "  upload failed (HTTP ${status:-000}): $body" >&2
        return 1
      }
      put sbom bom.cdx.json "&autoCreate=true&isLatest=$IS_LATEST"
      put sarif results.sarif ""
